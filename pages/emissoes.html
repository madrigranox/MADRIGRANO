<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Mock Demo - Emissões ESG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px;
            margin: 0;
        }

        .header {
            margin-bottom: 32px;
            border-bottom: 1px solid #334155;
            padding-bottom: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .kpi {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--accent);
        }

        .kpi.warn {
            border-left-color: #f59e0b;
        }

        .kpi.danger {
            border-left-color: #ef4444;
        }

        .kpi-title {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .kpi-val {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 8px;
        }

        .charts {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart-box {
            background: var(--card);
            height: 300px;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            font-weight: 600;
            margin-bottom: auto;
        }

        .mock-bars {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 200px;
            margin-top: 20px;
        }

        .bar {
            flex: 1;
            background: var(--accent);
            border-radius: 4px 4px 0 0;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Gestão de Indicadores ESG</h1>
        <p style="color:var(--muted)">Monitoramento consolidado Q3 - 2026 (MOCK DATA)</p>
    </div>
    <div class="grid">
        <div class="kpi">
            <div class="kpi-title">Emissões CO2e Totais</div>
            <div class="kpi-val">12,450 t</div>
        </div>
        <div class="kpi">
            <div class="kpi-title">Redução vs Ano Anterior</div>
            <div class="kpi-val" style="color: var(--accent);">-14.2%</div>
        </div>
        <div class="kpi warn">
            <div class="kpi-title">Consumo de Energia</div>
            <div class="kpi-val">84.5 GWh</div>
        </div>
        <div class="kpi danger">
            <div class="kpi-title">Resíduos não reciclados</div>
            <div class="kpi-val">18.2%</div>
        </div>
    </div>
    <div class="charts">
        <div class="chart-box">
            <div class="chart-title">Emissões por Escopo (Histórico)</div>
            <div class="mock-bars">
                <div class="bar" style="height: 40%"></div>
                <div class="bar" style="height: 60%"></div>
                <div class="bar" style="height: 55%"></div>
                <div class="bar" style="height: 80%"></div>
                <div class="bar" style="height: 70%"></div>
                <div class="bar" style="height: 90%; background: #ef4444;"></div>
                <div class="bar" style="height: 50%"></div>
            </div>
        </div>
        <div class="chart-box" style="align-items:center; justify-content:center; color: var(--muted);">
            [ Gráfico de Rosca: Fontes Renováveis ]
        </div>
    </div>
</body>

</html>
